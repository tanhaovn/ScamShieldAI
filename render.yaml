services:
  - type: web
    name: scamshieldai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_SQLITE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: scamshieldai-db
          property: connectionString
      - key: USE_DEEPFAKE_MODEL
        value: "false"
      - key: USE_VLM_ANALYZER
        value: "true"
      - key: GEMINI_VISION_MODEL
        value: "gemini-1.5-flash"
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: scamshieldai-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: scamshieldai_db
    user: scamshieldai_db_user
